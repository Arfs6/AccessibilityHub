{% extends baseTemplate %}

{% block title %}
<title>Logout | Accessibility Hub</title>
{% endblock %}

{% block content %}
<div class="row">
	<div class="col s12 m8 l6 offset-m2 offset-l3">
		<h1>Ready to leave?</h1>
		<div class="card">
			<div class="card-content">
				<p>Click the button below to logout.</p>
				<button type="button" class="btn btn-filled" hx-delete="{% url 'core:logout' %}{% if next %}?next={{ next }}{% endif %}">
					<i class="material-icons" aria-hidden="true">logout</i>Logout
				</button>
			</div>
		</div>
	</div>
</div>
{% endblock %}
