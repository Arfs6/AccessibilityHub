{% extends baseTemplate %}

{% block title %}
<title>Login | Accessibility Hub</title>
{% endblock %}

{% block content %}
<div class="row">
	<div class="col s12 m8 l6 offset-m2 offset-l3">
		<h1>Welcome back!</h1>
		<p>Login to continue contributing to the Accessibility Hub community.</p>
		<div class="card">
			<div class="card-content">
				<form action="{% url 'core:login' %}{% if next %}?next={{ next }}{% endif %}" method="POST"
					hx-post="{% url 'core:login' %}{% if next %}?next={{ next }}{% endif %}" hx-target="#main-content" hx-swap="innerHTML" role="form">
					{% csrf_token %}
					{{ form }}
					<button type="submit" class="btn btn-filled">Login</button>
				</form>
			</div>
		</div>
		<p>Don't have an account yet? <a href="{% url 'core:signup' %}{% if next %}?next={{ next }}{% endif %}">Create an account</a>.</p>
	</div>
</div>
{% endblock %}
