{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#04201C">
<link rel="icon" type="image/svg+xml" href="{% static 'core/img/favicon.svg' %}">

<!-- Htmx (intentionally pinned to 1.9.6) -->
<script src="https://unpkg.com/htmx.org@1.9.6"
	integrity="sha384-FhXw7b6AlE/jyjlZH5iHa/tTe9EpJ1Y55RjcgPbjeWMskSxZt1v9qkxLJWNJaGni"
	crossorigin="anonymous"></script>

<!-- Materialize 2.4.0 and fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/@materializecss/materialize@2.4.0/dist/css/materialize.min.css"
	integrity="sha384-sxA+Y1iSqNWviJOqujS2jN5xZ8XRqg3LUkIk1aTzYR7G3KGJLiY5iqPl8VnwAMNa"
	crossorigin="anonymous">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&display=swap"
	rel="stylesheet">

<!-- Site css (must stay after materialize.min.css) -->
<link rel="stylesheet" type="text/css" href="{% static 'core/main.css' %}?v=20261113">

<script>
	(function () {
		try {
			var savedTheme = window.localStorage.getItem('accessibilityhub-theme');
			var theme = savedTheme === 'light' || savedTheme === 'dark'
				? savedTheme
				: (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
			document.documentElement.dataset.theme = theme;
			var themeColor = document.querySelector('meta[name="theme-color"]');
			if (themeColor) {
				themeColor.setAttribute('content', theme === 'light' ? '#E0F2F1' : '#04201C');
			}
			if (window.localStorage.getItem('accessibilityhub-demo-banner-seen') === 'true') {
				document.documentElement.classList.add('demo-banner-seen');
			}
		} catch (error) {
			var fallbackTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
			document.documentElement.dataset.theme = fallbackTheme;
			var fallbackThemeColor = document.querySelector('meta[name="theme-color"]');
			if (fallbackThemeColor) {
				fallbackThemeColor.setAttribute('content', fallbackTheme === 'light' ? '#E0F2F1' : '#04201C');
			}
		}
	})();
</script>
