{% extends baseTemplate %}

{% block title %}
<title>Signup | Accessibility Hub</title>
{% endblock %}

{% block content %}
<div class="row">
	<div class="col s12 m8 l6 offset-m2 offset-l3">
		<section>
			<H1>Join us</h1>
			<p>You are one step away from being a part of us. It's easy, just fill the form below.</p>
			<div class="card">
				<div class="card-content">
					<form action="{% url 'core:signup' %}" method="POST">
						{% csrf_token %}
						{{ form }}
						{% if next %}
						<input type="hidden" name="next" value="{{ next }}">
						{% endif %}
						<button type="submit" class="btn btn-filled">Signup</button>
					</form>
				</div>
			</div>
		</section>
	</div>
</div>
{% endblock %}
