<div class="col s12 m6 l4">
	<article class="card listing-card">
		<div class="card-content">
			<h3><a href="{% url 'reviews:tool' ownerBase36Id=tool.owner.base36Id toolSlug=tool.slug %}">{{ tool.name }}</a></h3>
			<p class="listing-meta">Owner: <a href="{% url 'reviews:owner' base36Id=tool.owner.base36Id %}">{{ tool.owner.name }}</a></p>
			{% if tool.avgRating is None %}
			<p class="listing-meta">No rating yet.</p>
			{% else %}
			<p class="listing-meta">Rating: {{ tool.avgRating }} out of 5 {% include 'reviews/rating_stars.html' with rating=tool.avgRating %}</p>
			{% endif %}
			<p class="listing-description">{{ tool.description }}</p>
		</div>
	</article>
</div>
