<div class="card">
	<div class="card-content">
		<form {% if not userReview %}action="{% url 'reviews:tool' ownerBase36Id=owner.base36Id toolSlug=tool.slug %}" method="post" {% endif %}hx-{% if userReview %}put{% else %}post{% endif %}="{% url 'reviews:tool' ownerBase36Id=owner.base36Id toolSlug=tool.slug %}" hx-target="#main-content" hx-swap="innerHTML">
			{% csrf_token %}
			{{ form }}
			<button type="submit" class="btn btn-filled">Submit</button>
		</form>
	</div>
</div>
