<h2>Search results</h2>
{% if topics %}
<div class="row">
	{% for topic in topics %}
	<div class="col s12 m6 l4">
		<article class="card listing-card">
			<div class="card-content">
				<h3><a href="{% url 'discussions:topicPage' topic.base36Id %}">{{ topic.name }}</a></h3>
				<p class="listing-description">{{ topic.description }}</p>
			</div>
		</article>
	</div>
	{% endfor %}
</div>
{% else %}
<div class="card empty-state">
	<div class="card-content">
		<i class="material-icons" aria-hidden="true">search_off</i>
		<p>Your search did not match any topic. Please try a different search term.</p>
	</div>
</div>
{% endif %}
